persistence true
persistence_location /mosquitto/data/
log_dest stdout
per_listener_settings true

# Watcher connects to host:1883, mapped to this authenticated listener.
listener 1884
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/watcher.acl

# Trusted publishers execute inside this container through Docker.
# This listener is loopback-only and is NOT published to the host/network.
listener 1883 127.0.0.1
allow_anonymous true
